version: '3.9'

services:
  procurement-api:
    image: node:20-alpine
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: node services/procurement-api/server.js
    ports:
      - "3001:3001"
    environment:
      PORT: 3001

  web-portal:
    image: node:20-alpine
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: node services/web/web-server.js
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
