name: KBM Platform CI & Test Suite

on:
  push:
    branches: [ main, master, 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 20.x, 22.x ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Validate Bootstrap Zero-Cost Governance
        run: node scripts/bootstrap-validate.mjs

      - name: Run Platform QA Test Suite (43 Passing Tests)
        run: npm test

      - name: Run End-to-End Vertical Slice Cycle
        run: |
          npm start &
          sleep 3
          node scripts/test-complete-cycle.mjs
